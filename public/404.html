<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>Berkeley U.S. Tax Advisors</title>
    <meta name="robots" content="noindex" />
    <!--
      GitHub Pages SPA fallback (rafgraph/spa-github-pages).
      커스텀 도메인(apex)에서 서비스하므로 pathSegmentsToKeep = 0.
      요청 경로를 쿼리스트링으로 인코딩해 "/"로 리다이렉트하면,
      index.html의 복원 스크립트가 history.replaceState로 원래 경로를 되살린다.
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
